# Visons Backend - Docker Compose Configuration
# SQL Server 2022 + Spring Boot 3.5.13

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: visons-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin12345!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d
    networks:
      - visons-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Admin12345!", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  visons-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visons-backend
    environment:
      DB_URL: "jdbc:sqlserver://mssql-server:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true"
      DB_USER: "sa"
      DB_PASSWORD: "Admin12345!"
      PORT: "9090"
      SERVER_URL: "http://localhost:9090"
    ports:
      - "9090:9090"
    depends_on:
      mssql-server:
        condition: service_started
    networks:
      - visons-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

##############################################################################
# Networks - Comunicación entre contenedores
##############################################################################
networks:
  visons-network:
    driver: bridge

##############################################################################
# Volumes - Persistencia de datos
##############################################################################
volumes:
  mssql_data:
    driver: local
