spring:
  application:
    name: visons
  profiles:
    default: local
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${PORT:3000}

app:
  # Store uploaded profile images inside the project's resources so they are
  # served as static files. Path is relative to the project root.
  upload-dir: src/main/resources/static/uploads/profile-images
  client-login-url: ${CLIENT_LOGIN_URL:http://localhost:4200/login}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000,http://127.0.0.1:4000,http://localhost:3000,http://127.0.0.1:3000}
  mail:
    from: ${MAIL_FROM:no-reply@visons.local}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
