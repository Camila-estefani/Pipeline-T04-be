spring:
  application:
    name: visons
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
  url: http://localhost:8080

app:
  # Store uploaded profile images inside the project's resources so they are
  # served as static files. Path is relative to the project root.
  upload-dir: src/main/resources/static/uploads/profile-images

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
