server:
  port: 8080
  url: http://localhost:8080

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true
    username: sa
    password: Admin12345!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html