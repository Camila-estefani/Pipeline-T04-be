spring:
  application:
    name: visons
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Admin12345!}
    driver-class-name: ${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}
  url: ${SERVER_URL:http://localhost:8080}

app:
  upload-dir: src/main/resources/static/uploads/profile-images
  client-login-url: ${CLIENT_LOGIN_URL:http://localhost:4200/login}
  mail:
    from: ${MAIL_FROM:no-reply@visons.local}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html