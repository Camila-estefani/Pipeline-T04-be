# docker compose -f docker-compose-be.yml up -d
# docker compose -f docker-compose-be.yml down

services:
  visons-app:
    build:
      context: ..
      dockerfile: dockerfile-diego/Dockerfile
    image: diego5621/diegodock:latest
    container_name: visons-backend-diego
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:sqlserver://mssql-server:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true"
      DB_USER: "sa"
      DB_PASSWORD: "Admin12345!"
      PORT: "8080"
      SERVER_URL: "http://localhost:8080"
    networks:
      - visons-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

# CONSUMIR UNA RED EXISTENTE CREADA POR OTRO COMPOSE
networks:
  visons-network:
    external: true   # usa la red creada por el compose de la base de datos
